syntax = "proto3";
package cengyan.cluster.v1;
option java_package = "io.cengyan.protocol.proto";
option java_outer_classname = "ClusterProtocol";

// 集群业务协议不复用客户端 JSON，身份校验只在外部入口执行。
enum NodeRole { NODE_ROLE_UNSPECIFIED = 0; STORAGE = 1; COMPUTE = 2; }
message Endpoint { string host = 1; uint32 port = 2; }
message Node {
  string cluster_id = 1;
  string node_id = 2;
  NodeRole role = 3;
  Endpoint rpc = 4;
  Endpoint raft = 5;
  Endpoint client = 6;
  string zone = 7;
  string rack = 8;
  string data_mode = 9;
}
message RequestContext {
  string cluster_id = 1;
  string request_id = 2;
  string user = 3;
  uint64 graph_id = 4;
  uint32 part_id = 5;
  uint64 schema_version = 6;
  string lease_id = 7;
  uint64 remaining_timeout_ms = 8;
  uint64 controller_epoch = 9;
  SchemaLease schema_lease = 10;
}
message RpcRequest {
  RequestContext context = 1;
  string method = 2;
  bytes body = 3;
}
message LeaderHint {
  string node_id = 1;
  Endpoint rpc = 2;
  uint64 term = 3;
  uint64 topology_version = 4;
}
message RpcResponse {
  string code = 1;
  string message = 2;
  bytes body = 3;
  LeaderHint leader_hint = 4;
}
message Credit { uint64 bytes = 1; uint32 batches = 2; SchemaLease schema_lease = 3; }
message Value {
  oneof kind {
    bool null_value = 1;
    sint64 int_value = 2;
    string string_value = 3;
    double double_value = 4;
    bool bool_value = 5;
    bytes bytes_value = 6;
  }
}
message Row { repeated Value values = 1; }
message DataBatch { repeated string columns = 1; repeated Row rows = 2; uint64 sequence = 3; }
message Mutation { bytes key = 1; bytes value = 2; bool delete = 3; }
message Condition {
  bytes key = 1;
  bool expected_present = 2;
  bytes expected_value = 3;
}
message WriteBatch {
  string request_id = 1;
  repeated Mutation mutations = 2;
  // 由协调者确定的时间，状态机不能使用各副本本地时钟决定记录内容。
  uint64 expires_at_ms = 3;
  // 状态机内检查，而不是仅在 Leader 提交前检查，防止并发校验竞态。
  repeated Condition conditions = 4;
  // 清理命令只删除这里列出的、已完成且到达指定截止时间的去重记录。
  repeated string purge_request_ids = 5;
  uint64 purge_before_ms = 6;
  uint64 controller_epoch = 7;
}
message ReadKey {
  bytes key = 1;
  bool scan = 2;
  bytes after_key = 3;
  uint32 limit = 4;
  uint32 max_bytes = 5;
  string cursor_id = 6;
  bool close_cursor = 7;
  string scan_id = 8;
  string entity_type = 9;
  repeated PropertyEquals filters = 10;
  bool scan_idempotency = 11;
  bool transaction_summaries = 12;
  repeated bytes keys = 13;
  // 分片已提交实体计数，只读取元数据，不扫描实体或构造事务读视图。
  bool entity_counts = 14;
  uint64 counts_generation = 15;
}
message EntityTypeCount { bool node = 1; string type = 2; uint64 count = 3; }
message EntityCounts {
  uint32 format_version = 1;
  uint64 generation = 2;
  uint64 total_nodes = 3;
  uint64 total_edges = 4;
  repeated EntityTypeCount types = 5;
}
message BatchValues { repeated StoredValue values = 1; }
message PropertyEquals { string property = 1; Value expected = 2; }
message KeyValue { bytes key = 1; bytes value = 2; }
message ScanPage { repeated KeyValue entries = 1; bytes last_key = 2; bool more = 3; string cursor_id = 4; }
message StoredValue { bool found = 1; bytes value = 2; }
message BatchResult { string code = 1; string message = 2; uint64 affected = 3; }
message IdempotencyRecord { bytes digest = 1; BatchResult result = 2; uint64 expires_at_ms = 3; }
message DataGroupSpec { uint64 graph_id = 1; uint32 part_id = 2; repeated Node members = 3; repeated Node learners = 4; string control_task_id = 5; string data_mode = 6; }
// Rebuild-only data replicas. Metadata holds decisions/identities, never the data command body.
message ReplicaReceipt { string node_id = 1; string boot_id = 2; uint64 sequence = 3; bytes digest = 4; }
message RebuildHead {
  DataGroupSpec spec = 1;
  uint64 sequence = 2;
  string state = 3;
  string operation_id = 4;
  bytes digest = 5;
  repeated ReplicaReceipt receipts = 6;
  repeated ReplicaReceipt staged = 7;
  DataGroupSpec target = 8;
  uint64 operation_deadline_ms = 9;
}
message RebuildMessage {
  uint64 graph_id = 1;
  uint32 part_id = 2;
  RebuildHead head = 3;
  WriteBatch command = 4;
  ScanPage page = 5;
  bytes after_key = 6;
  string transfer_id = 7;
  bytes digest = 8;
  uint64 count = 9;
  string boot_id = 10;
}
message ReplicaTask { string task_id = 1; DataGroupSpec before = 2; DataGroupSpec after = 3; string stage = 4; string error = 5; }
message GroupStatus { string leader_id = 1; uint64 term = 2; uint64 applied_index = 3; repeated string members = 4; }

// 批次事务：协调日志包含完整计划，Compute 消失后 Storage 仍能收尾。
enum TransactionState { TX_UNSPECIFIED = 0; PREPARING = 1; COMMITTED = 2; ABORTED = 3; }
message TransactionPlan {
  string transaction_id = 1;
  uint64 graph_id = 2;
  uint32 coordinator_part = 3;
  repeated ParticipantPlan participants = 4;
  uint64 deadline_ms = 5;
  bytes content_digest = 6;
  bool schema_migration = 7;
  uint64 generation = 8;
  uint64 write_epoch = 9;
  bool compensation = 10;
  uint32 compensation_coordinator = 11;
}
message ParticipantPlan { uint32 part_id = 1; repeated ConditionalMutation changes = 2; }
message ConditionalMutation {
  bytes key = 1;
  bool expected_present = 2;
  bytes expected_cell = 3;
  bytes value = 4;
  bool delete = 5;
  bool read_only = 6;
}
message TransactionRecord {
  TransactionPlan plan = 1;
  TransactionState state = 2;
  string error_code = 3;
  string error_message = 4;
  bool finalized = 5;
  uint64 decided_at_ms = 7;
}
message CellVersion {
  string transaction_id = 1;
  uint32 coordinator_part = 2;
  bytes value = 3;
  bool deleted = 4;
  bool compensation = 5;
  uint64 committed_at_ms = 6;
  bool baseline = 7;
}
message VersionedCell { repeated CellVersion versions = 1; }
message ReservationOwner { string transaction_id = 1; uint32 coordinator_part = 2; }
message ReservationState { ReservationOwner writer = 1; repeated ReservationOwner readers = 2; }
enum IdType { ID_UNSPECIFIED = 0; INT64 = 1; STRING = 2; }
message GraphDefinition {
  uint64 id = 1; string name = 2; uint32 partitions = 3; uint32 replicas = 4;
  IdType vertex_id_type = 5; IdType edge_id_type = 6; uint64 schema_version = 7;
  string state = 8; repeated TypeDefinition types = 9; repeated IndexDefinition indexes = 10;
  uint64 generation = 11;
  uint64 write_epoch = 12;
  string comment = 13;
  string data_mode = 14;
}
message TypeDefinition {
  string name = 1;
  bool node = 2;
  repeated PropertyDefinition properties = 3;
  string comment = 5;
  uint32 id = 6;
  IdType id_type = 7;
  uint32 id_length = 8;
}
message PropertyDefinition {
  string name = 1;
  string type = 2;
  bool nullable = 3;
  string source_property = 4;
  string comment = 5;
}
message IndexDefinition { string name = 1; bool node = 2; string type_name = 3; repeated string properties = 4; bool unique = 5; string index_id = 6; }
message Entity {
  Value id = 1; string type = 2; bool node = 3; Value source = 4; Value target = 5;
  map<string, Value> properties = 6; string state = 7;
  string incarnation = 8;
}
message RequestTicket {
  TransactionPlan plan = 1; bytes input_digest = 2; uint64 affected = 3; uint64 duplicates = 4; uint64 skipped = 5;
}
message DeleteTask { GraphDefinition graph = 1; Value vertex_id = 2; string request_id = 3; bool completed = 4; uint64 edges_deleted = 5; string incarnation = 6; }
message SchemaLease {
  string lease_id = 1; string request_id = 2; uint64 graph_id = 3; uint64 schema_version = 4;
  uint64 generation = 5; uint64 issued_at_ms = 6; uint64 expires_at_ms = 7; uint64 hard_deadline_ms = 8; uint64 metadata_epoch = 9;
}
message LeaseHorizon { uint64 graph_id = 1; uint64 schema_version = 2; uint64 generation = 3; uint64 grant_until_ms = 4; uint64 retain_until_ms = 5; uint64 epoch = 6; }
message SchemaMigrationTask {
  string task_id = 1; GraphDefinition before = 2; GraphDefinition after = 3; string stage = 4;
  repeated uint32 completed_parts = 5; string error = 6; uint64 retain_until_ms = 7;
}
message GqlWritePlan {
  bytes digest = 1; repeated Entity updates = 2; repeated Entity deletes = 3; bool completed = 4; uint64 affected = 5;
  repeated Entity expected_entities = 6;
}
message IndexBuildTask { string request_id = 1; GraphDefinition before = 2; IndexDefinition index = 3; string stage = 4; string error = 5; }
