# 分布式 Storage 独立配置；不能指向旧单机数据库目录。
cluster_id=cengyan-dev
node_id=storage-1
rpc_address=127.0.0.1:19701
raft_address=127.0.0.1:19700
data_dir=../storage-data/storage-1
# Data 分片：重启作废并从健康成员全量重建；Metadata 继续使用持久化 Raft。
# 测试单份数据重启后需新建图重新导入；生产 replicas 至少为 3（总份数）。
data_storage_mode=rebuild
# 成员格式：nodeId@Raft地址@业务RPC地址；生产建议至少三个存储节点。
metadata_members=storage-1@127.0.0.1:19700@127.0.0.1:19701
# rebuild 模式下以下 Raft 参数仅作用于 Metadata 控制面。
raft_log_segment_bytes=67108864
raft_snapshot_entries=100000
raft_log_retained_entries=10000
raft_snapshot_retained=2
rpc_max_payload_bytes=33554432
rpc_max_inflight=128
admission_threads=2
admission_queue=256
# 写事务协调与分片写入分别使用独立线程池，每个池的线程数；重启生效。
write_threads=10
replica_recovery_timeout_ms=1800000
background_interval_ms=10000
background_bytes_per_second=67108864
# 幂等去重窗口（毫秒）：窗口内重复提交同一请求返回首次结果，超时后清理去重记录。
# 默认 1 小时。窗口越长，分片库里保存的去重记录越多；所有 Storage 和 Compute 应保持一致。
idempotency_window_ms=3600000
zone=
rack=
