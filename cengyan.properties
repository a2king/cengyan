# Cengyan server configuration.
# Values are loaded at startup. Restart the server after changing this file.

# -----------------------------------------------------------------------------
# Server and network
# -----------------------------------------------------------------------------
# TCP bind address. Use 127.0.0.1 for local-only access.
host=0.0.0.0
# Native line-protocol port.
port=19669
# HTTP JSON gateway port. Set to 0 to disable the gateway.
http_port=19671
# Enable HTTPS for the HTTP gateway.
http_tls_enabled=false
# PKCS12 keystore used when HTTP TLS is enabled.
http_tls_keystore=config/server.p12
# Keystore password. Keep secrets outside source control in production.
http_tls_password=

# -----------------------------------------------------------------------------
# Storage and filesystem
# -----------------------------------------------------------------------------
# Data root. Each graph keeps its own files, and RocksDB WAL / flush files stay
# in the directory they belong to:
#   <data_dir>/<graph>/data/node/<node-type>/<partition>
#   <data_dir>/<graph>/data/edge/<edge-type>/<partition>
#   <data_dir>/<graph>/index/<node-or-edge>-<field>/<partition>
#   <data_dir>/<graph>/meta
# Users, graph names and cluster membership live in <data_dir>/_system.
data_dir=data
# Shared RocksDB block cache size in bytes.
block_cache_bytes=268435456
# Maximum RocksDB background flush/compaction jobs per opened database.
rocksdb_background_jobs=6
# MemTable write buffer size per Column Family, in bytes.
# The buffer, its WAL and the compressed files produced by flush or compaction
# stay in the database directory they belong to.
rocksdb_write_buffer_bytes=134217728
# Flush and compact write caches of databases that are already open.
# The next round waits until the previous one finishes. 0 disables the timer.
cache_compact_interval_minutes=30

# -----------------------------------------------------------------------------
# Query execution and resource protection
# -----------------------------------------------------------------------------
# Number of server-side query worker threads.
query_threads=16
# Slots inside query_threads kept for login and metadata. Must be less than query_threads.
interactive_reserved=2
# Separate workers for bulk import, stats, index rebuild and compaction.
heavy_query_threads=2
# How long a statement waits for a free worker, in milliseconds.
query_queue_ms=30000
# Default execution deadline in milliseconds. 0 means no server deadline.
max_execution_time_ms=0
# Extra deadline cap for heavy work, in milliseconds. 0 means no extra cap.
heavy_max_execution_time_ms=0
# Maximum edges examined from one vertex. 0 means unlimited.
# For stability, set this to a finite value in deployments that may query
# supernodes. A supernode expansion is performed before DuckDB is involved.
max_edges_per_vertex=0
# Maximum new frontier vertices produced by one traversal hop. 0 means unlimited.
# This is the main protection against a multi-hop query multiplying through a
# supernode. DuckDB does not protect this traversal phase.
max_frontier_per_hop=0
# Maximum traversal hops. 0 means unlimited.
max_hops=0
# Maximum returned paths. 0 means unlimited.
max_paths=0
# Per-query memory budget in bytes. Enforcement depends on the query operator.
query_memory_bytes=67108864

# -----------------------------------------------------------------------------
# Analytical execution engine
# -----------------------------------------------------------------------------
# DuckDB memory limit for sorting, aggregation and analytical operators.
duckdb_memory=1GB
# DuckDB temporary spill directory.
duckdb_temp_directory=data/cache/duck
# Maximum temporary disk space for one DuckDB query. This is not a global disk
# quota; keep it finite so one query cannot reserve an unbounded amount of disk.
duckdb_max_temp_directory_size=10GB
# DuckDB worker threads per query. 1 favors service stability and concurrency.
duckdb_threads=1

# Whether a traversal may move its temporary frontier/visited state to DuckDB.
supernode_spill_enabled=true
# A vertex whose scanned edge count exceeds this value activates query-local spill.
supernode_edge_threshold=10000
# Allow frontier and visited sets to move to DuckDB after spill activation.
supernode_frontier_spill_enabled=true
# Maximum temporary spill space for one supernode query.
supernode_spill_max_bytes=10737418240
# Number of edges buffered before a spill batch is written.
supernode_spill_batch_edges=4096

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# Password used to create the root user on the first startup only.
root_password=cengyan
