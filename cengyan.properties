# 层岩图数据库启动配置。运行中不热更新。
# 32GB 机器的块缓存按计划书取 8GB（8589934592）。下面是开发机取值。

# 监听地址。0.0.0.0 表示所有网卡，内网用本机 IP 加端口来连。只允许本机时改成 127.0.0.1。
host=0.0.0.0
# 监听端口。
port=19669
# 数据目录，相对启动服务时的工作目录。
data_dir=data/data
# 同时执行查询的线程数。
query_threads=16
# 请求里没有写 timeoutMs 时，单条语句最多执行的毫秒数。
max_execution_time_ms=1000
# 从一个点出发最多扫描的边数。起点没写 id、只写了类型时，扫点也用这个上限。超过返回 TRUNCATED。
max_edges_per_vertex=200
# 多跳时，一跳里新到达的点数上限。超过返回 FRONTIER_EXCEEDED。
max_frontier_per_hop=200
# 多跳、最短路、子图允许的最大跳数。
max_hops=20
# 多跳结果要返回边的内容时，结果行数上限。超过返回 PATH_LIMIT_EXCEEDED。
max_paths=50000
# 单条查询的内存预算，单位字节。当前会读入，查询执行还没有按这个值截断。
query_memory_bytes=67108864
# RocksDB 块缓存大小，单位字节。这里是开发机的 256MB。
block_cache_bytes=268435456
# 排序和聚合使用的 DuckDB 内存上限。
duckdb_memory=1GB
# DuckDB 临时文件目录，相对启动服务时的工作目录。
duckdb_temp_directory=data/cache/duck
# 穿透持股时，单条边的比例低于这个值就不再往下走。
min_edge_ratio=0.01
# 穿透持股时，累乘后的比例低于这个值就不再往下走。
min_accum_ratio=0.001
# 库里还没有任何用户时，用这个密码创建读写用户 root。已经有用户则不会改密码。
root_password=cengyan
